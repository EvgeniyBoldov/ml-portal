name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  atlassian-adapter-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install pinned Atlassian upstream and test dependencies
      run: pip install -r mcp/atlassian_adapter/requirements-test.txt
    - name: Check embedded adapter startup
      run: python -c 'from atlassian_adapter.server import app; assert app.upstream_app is not None'
      env:
        PYTHONPATH: mcp:apps/api/src
    - name: Test shared adapter and broker-bound native tools
      run: >-
        python -m pytest --noconftest -o addopts= -o asyncio_default_fixture_loop_scope=function -q
        mcp/adapter/tests/ mcp/atlassian_adapter/tests/
      env:
        PYTHONPATH: mcp:apps/api/src

  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api/src
      ENV: test
      JWT_SECRET: ci-only-jwt-signing-secret-for-disposable-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd apps/api
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Check migration state
      run: |
        cd apps/api
        python -m alembic current
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0

    - name: Run migrations
      run: |
        cd apps/api
        python -m alembic upgrade head
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
    
    - name: Run backend runtime core tests
      run: |
        cd apps/api
        pytest tests/unit -q --tb=short --maxfail=10 \
          --cov=app.runtime \
          --cov=app.agents.runtime \
          --cov=app.agents.contracts \
          --cov=app.agents.credential_resolver \
          --cov=app.agents.execution_preflight \
          --cov=app.agents.operation_router \
          --cov=app.agents.runtime_rbac_resolver \
          --cov-fail-under=70 \
          --cov-report=term-missing \
          --cov-report=xml:coverage-runtime.xml \
          --junitxml=api-unit-results.xml
        python -m coverage report --include='*/runtime/pipeline.py' --fail-under=70
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Validate runtime args contract (jsonschema ON)
      run: |
        cd apps/api
        pytest tests/unit/test_runtime_operation_validation.py -q --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Validate runtime args contract (jsonschema OFF fallback)
      run: |
        cd apps/api
        RUNTIME_DISABLE_JSONSCHEMA=1 pytest tests/unit/test_runtime_operation_validation.py -q --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test

    - name: Run backend integration tests
      run: |
        curl --fail --silent --show-error --retry 20 --retry-connrefused http://127.0.0.1:6333/readyz
        docker exec "${{ job.services.postgres.id }}" createdb -U postgres test_tool_results
        cd apps/api
        pytest tests/integration tests/migrations -q --tb=short
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENV: test
        DASHBOARD_PG: "1"
        SHADOW_WORKFLOW_PG: "1"
        PROMPT_POLICY_MIGRATION_PG: "1"
        PERIODIC_TASKS_PG: "1"
        MEMORY_WORKFLOW_PG: "1"
        RUNTIME_PROTOCOL_PG: "1"
        AGENT_ADMIN_PG: "1"
        TURN_FILE_CONTEXT_PG: "1"
        SANDBOX_LIFECYCLE_PG: "1"
        TOOL_WORKSPACE_PG: "1"
        FILE_DATA_QDRANT: "1"
        VECTOR_MODEL_WORKFLOW: "1"
        QDRANT_URL: http://127.0.0.1:6333
        TOOL_RESULTS_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_tool_results
        TASK_MEMORY_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        MEMORY_OPERATIONS_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        SCOPE_MIGRATION_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        RUNTIME_INTERACTION_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: apps/api/coverage-runtime.xml
        flags: backend
        name: backend-runtime-coverage
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: |
          apps/api/coverage-runtime.xml
          apps/api/api-unit-results.xml

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
    
    - name: Run type checking
      run: |
        cd apps/web
        npm run type-check
    
    - name: Run unit tests
      run: |
        cd apps/web
        npm run test:coverage -- --run
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: apps/web/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
    
    - name: Run linting
      run: |
        cd apps/web
        npm run lint

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          apps/web/coverage/
          apps/web/test-results/

  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd apps/api
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Install frontend dependencies
      run: |
        cd apps/web
        npm ci
    
    - name: Start object storage
      run: |
        docker run --rm -d -p 127.0.0.1:9000:9000 \
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
          minio/minio:latest server /data
        curl --fail --silent --show-error --retry 20 --retry-connrefused \
          http://127.0.0.1:9000/minio/health/live

    - name: Migrate and start the E2E API
      run: |
        docker exec "${{ job.services.postgres.id }}" createdb -U postgres test_tool_results
        cd apps/api
        python -m alembic upgrade heads
        python -m alembic -c tool_results_alembic.ini upgrade head
        python -m uvicorn tests.e2e.chat_contract_app:app --host 127.0.0.1 --port 8000 \
          > "$RUNNER_TEMP/portal-e2e-api.log" 2>&1 &
        curl --fail --silent --show-error --retry 20 --retry-connrefused \
          http://127.0.0.1:8000/api/v1/healthz
      env:
        PYTHONPATH: src
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        ASYNC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        TOOL_RESULTS_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_tool_results
        REDIS_URL: redis://localhost:6379/0
        S3_ENDPOINT: http://127.0.0.1:9000
        DOCLING_URL: http://127.0.0.1:1
        ENV: local
        CHAT_CONTRACT_E2E: "1"

    - name: Build frontend and install Chromium
      working-directory: apps/web
      run: |
        npm run build
        npx playwright install --with-deps chromium

    - name: Run browser contracts
      working-directory: apps/web
      run: |
        umask 077
        auth_file="$RUNNER_TEMP/portal-e2e-auth.json"
        printf '%s\n' '{"login":"admin","password":"admin123"}' > "$auth_file"
        AGENT_E2E_AUTH_FILE="$auth_file" MEMORY_SCOPE_E2E_AUTH_FILE="$auth_file" \
          npx playwright test e2e-tests/smoke.e2e.ts e2e-tests/agent-admin.e2e.ts \
          e2e-tests/memory-scopes.e2e.ts --project=chromium --reporter=line
        npm run dev -- --strictPort > "$RUNNER_TEMP/portal-e2e-vite.log" 2>&1 &
        vite_pid=$!
        trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
        curl --fail --silent --show-error --retry 20 --retry-connrefused http://localhost:5173/
        CHAT_E2E_AUTH_FILE="$auth_file" npm run test:e2e:chat
      env:
        BASE_URL: http://localhost:5173
        VITE_API_PROXY_TARGET: http://127.0.0.1:8000

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: |
          apps/web/test-results/
          /tmp/chat-contract-e2e-results/
          ${{ runner.temp }}/portal-e2e-api.log

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
