services:
  # Standalone document conversion API for development; not deployed to production.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.30.0
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_LOG_LEVEL: INFO
      DOCLING_DEVICE: cpu
      OMP_NUM_THREADS: ${DOCLING_NUM_THREADS:-2}
    ports:
      - "127.0.0.1:${DOCLING_PORT:-8016}:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  hipporag:
    build:
      context: .
      dockerfile: mcp/hipporag/Dockerfile
    restart: unless-stopped
    environment:
      HIPPO_CHUNK_TOKENS: ${HIPPO_CHUNK_TOKENS:-480}
      HIPPO_SEARCH_WORKERS: ${HIPPO_SEARCH_WORKERS:-8}
      HIPPO_LLM_MAX_ATTEMPTS: ${HIPPO_LLM_MAX_ATTEMPTS:-3}
      HIPPO_LLM_RETRY_BASE_SECONDS: ${HIPPO_LLM_RETRY_BASE_SECONDS:-2}
      HIPPO_LLM_RETRY_MAX_SECONDS: ${HIPPO_LLM_RETRY_MAX_SECONDS:-30}
      HIPPO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${HIPPO_PORT:-8015}:8080"
    volumes:
      - hipporag_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  memory-experiment:
    build:
      context: .
      dockerfile: infra/docker/memory-experiment/Dockerfile
    restart: unless-stopped
    environment:
      HIPPO_URL: http://hipporag:8080
    volumes:
      - ./.long-memory-experiment:/experiment
    depends_on:
      hipporag:
        condition: service_healthy

  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-tool-results:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${TOOL_RESULTS_POSTGRES_DB:-tool_results}
      POSTGRES_USER: ${TOOL_RESULTS_POSTGRES_USER:-tool_results}
      POSTGRES_PASSWORD: ${TOOL_RESULTS_POSTGRES_PASSWORD:-tool_results_password}
    volumes:
      - postgres_tool_results_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOOL_RESULTS_POSTGRES_USER:-tool_results} -d ${TOOL_RESULTS_POSTGRES_DB:-tool_results}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Remote PostgreSQL — used by SQL MCP shim (dbhub-mcp) as demo external data source
  # postgres-remote:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: ${REMOTE_POSTGRES_DB}
  #     POSTGRES_USER: ${REMOTE_POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${REMOTE_POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_remote_data:/var/lib/postgresql/data
  #   ports:
  #     - "5433:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${REMOTE_POSTGRES_USER} -d ${REMOTE_POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # VECTOR DATABASE
  # =============================================================================

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

  # =============================================================================
  # OBJECT STORAGE — MinIO
  # =============================================================================

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: files.localhost
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # BACKEND API SERVICE
  # =============================================================================

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src/app:/app/app
      - ./apps/api/tests:/app/tests
      - ./apps/api/pytest.ini:/app/pytest.ini
      - ./models_llm:/app/models_llm
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - MODELS_ROOT=/app/models_llm
      - MEMORY_SEARCH_BACKEND=${MEMORY_SEARCH_BACKEND:-hipporag}
      - HIPPO_WORKER_URL=${HIPPO_WORKER_URL:-http://hipporag:8080}
      - HIPPO_CALLBACK_URL=${HIPPO_CALLBACK_URL:-http://api:8000/api/v1/internal/hipporag}
      - HIPPO_TIMEOUT_SECONDS=${HIPPO_TIMEOUT_SECONDS:-1800}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - DOCLING_TIMEOUT_SECONDS=${DOCLING_TIMEOUT_SECONDS:-180}
      - TOOL_RESULTS_DB_URL=postgresql+asyncpg://${TOOL_RESULTS_POSTGRES_USER:-tool_results}:${TOOL_RESULTS_POSTGRES_PASSWORD:-tool_results_password}@postgres-tool-results:5432/${TOOL_RESULTS_POSTGRES_DB:-tool_results}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-tool-results:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade heads &&
        alembic -c tool_results_alembic.ini upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # FRONTEND DEVELOPMENT SERVICE
  # =============================================================================

  frontend:
    image: node:20-alpine
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    env_file: .env
    environment:
      - NODE_ENV=development
    command: >
      sh -c "
        if [ ! -d 'node_modules' ] || [ ! -d 'node_modules/react-markdown' ]; then
          npm install --legacy-peer-deps
        fi &&
        rm -f node_modules/style-to-object/cjs/index.js.map 2>/dev/null || true &&
        npm run dev -- --host 0.0.0.0
      "
    depends_on:
      - api

  # Persistent headless browser for visual reviews. The dev UI is proxied at
  # http://nginx:8080/gpt/ from containers on the Compose network.
  chromium-review:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    init: true
    working_dir: /workspace
    volumes:
      - ./apps/web:/workspace
      - chromium_review_profile:/ms-playwright-user-data
    ports:
      - "127.0.0.1:9222:9222"
    command:
      - /ms-playwright/chromium-1091/chrome-linux/chrome
      - --headless
      - --no-sandbox
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --user-data-dir=/ms-playwright-user-data
      - --no-first-run
      - about:blank
    depends_on:
      - frontend

  # =============================================================================
  # MCP SERVERS
  # =============================================================================

  netbox-mcp-custom:
     build:
       context: .
       dockerfile: mcp/mcp_server.dockerfile
       args:
         - MCP_SERVER_DIR=netbox
     ports:
       - "8012:8080"
     volumes:
       - ./mcp/netbox/server.py:/opt/mcp/netbox/server.py:ro
     environment:
       - PORT=8080
       - VERIFY_SSL=false
       - NETBOX_TIMEOUT_SECONDS=20
       - MCP_SECRET_BROKER_TIMEOUT_SECONDS=10
     extra_hosts:
       - "host.docker.internal:host-gateway"
     restart: unless-stopped

  # dbhub-mcp:
  #   build:
  #     context: .
  #     dockerfile: mcp/mcp_server.dockerfile
  #     args:
  #       - MCP_SERVER_DIR=sql
  #   ports:
  #     - "8011:8080"
  #   environment:
  #     - PORT=8080
  #     - DB_DSN=postgres://${REMOTE_POSTGRES_USER}:${REMOTE_POSTGRES_PASSWORD}@${REMOTE_POSTGRES_HOST:-postgres-remote}:5432/${REMOTE_POSTGRES_DB}?sslmode=disable
  #     - DB_READONLY=true
  #     - DB_MAX_ROWS=200
  #   depends_on:
  #     postgres-remote:
  #       condition: service_healthy
  #   restart: unless-stopped

  atlassian-jira-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        - MCP_SERVER_DIR=atlassian
    ports:
      - "8013:8080"
    environment:
      - PORT=8080
      - VERIFY_SSL=true
      - JIRA_CA_BUNDLE=
      - JIRA_TIMEOUT_SECONDS=20
      - JIRA_MCP_MAX_RESULTS=50
      - MCP_SECRET_BROKER_TIMEOUT_SECONDS=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Upstream sooperset/mcp-atlassian behind the Portal credential/risk/filter adapter.
  atlassian-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        - MCP_SERVER_DIR=atlassian_adapter
    ports:
      - "127.0.0.1:${ATLASSIAN_ADAPTER_PORT:-8017}:8080"
    environment:
      - PORT=8080
      - JIRA_URL=${ATLASSIAN_JIRA_URL:-https://jira.invalid}
      - JIRA_PERSONAL_TOKEN=broker-managed-placeholder
      - CONFLUENCE_URL=${ATLASSIAN_CONFLUENCE_URL:-https://confluence.invalid}
      - CONFLUENCE_PERSONAL_TOKEN=broker-managed-placeholder
      - ALLOW_GLOBAL_CRED_FALLBACK=false
      - READ_ONLY_MODE=false
      - MCP_ALLOWED_URL_DOMAINS=${ATLASSIAN_ALLOWED_URL_DOMAINS:-}
      - ATLASSIAN_MCP_ENABLED_TOOLS=${ATLASSIAN_MCP_ENABLED_TOOLS:-jira_search,jira_get_issue,jira_get_project_issues,confluence_search,confluence_get_page}
      - MCP_SECRET_BROKER_TIMEOUT_SECONDS=${MCP_SECRET_BROKER_TIMEOUT_SECONDS:-10}
      - ATLASSIAN_MCP_TIMEOUT_SECONDS=${ATLASSIAN_MCP_TIMEOUT_SECONDS:-120}
    restart: unless-stopped

  ml-inference-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        - MCP_SERVER_DIR=ml_inference
    ports:
      - "127.0.0.1:8014:8080"
    environment:
      - PORT=8080
      - VERIFY_SSL=${ML_INFERENCE_VERIFY_SSL:-true}
      - ML_INFERENCE_CA_BUNDLE=${ML_INFERENCE_CA_BUNDLE:-}
      - ML_INFERENCE_TIMEOUT_SECONDS=${ML_INFERENCE_TIMEOUT_SECONDS:-30}
      - ML_INFERENCE_MAX_RESPONSE_BYTES=${ML_INFERENCE_MAX_RESPONSE_BYTES:-262144}
      - MCP_SECRET_BROKER_TIMEOUT_SECONDS=${MCP_SECRET_BROKER_TIMEOUT_SECONDS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # =============================================================================
  # EMBEDDING SERVICES
  # Each instance serves one model. Add more instances for additional models.
  # API resolves the correct instance by EMB_BASE_URL stored in the models table.
  # =============================================================================

  # Optional compact embedding model; the registry default is served by emb-bge.
  emb:
    build:
      context: .
      dockerfile: infra/docker/emb/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - EMB_MODEL_PATH=/models_llm/sentence-transformers--all-MiniLM-L6-v2
      - EMB_BATCH_SIZE=32
      - EMB_MAX_WAIT_MS=15
      - EMB_MODEL_PARALLELISM=2
    volumes:
      - ./models_llm:/models_llm:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  emb-bge:
    build:
      context: .
      dockerfile: infra/docker/emb/Dockerfile
    environment:
      - EMB_MODEL_ALIAS=bge-m3
      - EMB_MODEL_PATH=/models_llm/BAAI--bge-m3
      - EMB_MODEL_DIMENSIONS=1024
      - EMB_MODEL_MAX_TOKENS=8192
      - EMB_BATCH_SIZE=4
      - EMB_MAX_WAIT_MS=15
      - EMB_MODEL_PARALLELISM=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - ./models_llm:/models_llm:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Example: second embedding instance for a larger model (e1024 dims).
  # Uncomment and adjust when you need a second embedding model.
  # Register it in the models table with base_url=http://emb-large:8001
  # ---------------------------------------------------------------------------
  # emb-large:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/emb/Dockerfile
  #   ports:
  #     - "8003:8001"
  #   environment:
  #     - EMB_MODEL_PATH=/models_llm/intfloat--multilingual-e5-large
  #     - EMB_BATCH_SIZE=32
  #     - EMB_MAX_WAIT_MS=15
  #     - EMB_MODEL_PARALLELISM=1
  #   volumes:
  #     - ./models_llm:/models_llm:ro
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s

  # =============================================================================
  # RERANKER SERVICE
  # =============================================================================

  rerank:
    build:
      context: .
      dockerfile: infra/docker/rerank/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - RERANK_MODEL_PATH=/models_llm/cross-encoder--ms-marco-MiniLM-L-6-v2
    volumes:
      - ./models_llm:/models_llm:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rerank-bge:
    build:
      context: .
      dockerfile: infra/docker/rerank/Dockerfile
    environment:
      - RERANK_MODEL_ALIAS=bge-reranker-v2-m3
      - RERANK_MODEL_PATH=/models_llm/BAAI--bge-reranker-v2-m3
      - RERANK_MODEL_MAX_TOKENS=1024
      - RERANK_BATCH_SIZE=4
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - ./models_llm:/models_llm:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # =============================================================================
  # CELERY WORKER
  # =============================================================================

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    volumes:
      - ./apps/api/src/app:/app/app
      - ./models_llm:/models_llm:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - MEMORY_SEARCH_BACKEND=${MEMORY_SEARCH_BACKEND:-hipporag}
      - HIPPO_WORKER_URL=${HIPPO_WORKER_URL:-http://hipporag:8080}
      - HIPPO_CALLBACK_URL=${HIPPO_CALLBACK_URL:-http://api:8000/api/v1/internal/hipporag}
      - HIPPO_TIMEOUT_SECONDS=${HIPPO_TIMEOUT_SECONDS:-1800}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - DOCLING_TIMEOUT_SECONDS=${DOCLING_TIMEOUT_SECONDS:-180}
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      postgres-tool-results:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]

  beat:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
    profiles:
      - scheduler
    volumes:
      - ./apps/api/src/app:/app/app
      - ./models_llm:/models_llm:ro
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      postgres-tool-results:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]

  flower:
    image: mher/flower:2.0.1
    ports:
      - "5555:5555"
    environment:
      FLOWER_BASIC_AUTH: ${DEFAULT_ADMIN_LOGIN}:${DEFAULT_ADMIN_PASSWORD}
      FLOWER_PORT: 5555
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  # =============================================================================
  # NGINX REVERSE PROXY
  # =============================================================================

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "8080:8080"
      - "8443:443"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/files.conf:/etc/nginx/conf.d/files.conf:ro
      - ./infra/ssl:/etc/ssl/certs:ro
    depends_on:
      - api
      - frontend
      - minio
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://api:8000/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hipporag_data:
  postgres_data:
  postgres_tool_results_data:
  postgres_remote_data:
  redis_data:
  minio_data:
  qdrant_data:
  frontend_node_modules:
  chromium_review_profile:
