# =============================================================================
# ML Portal — Build Compose
#
# Builds all production images locally.
# Run on CI or developer machine before pushing to registry / deploying to prod.
#
# Usage:
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml push   # if registry is configured
#
# Image naming convention: ${IMAGE_REPOSITORY}/<service>:${APP_IMAGE_TAG}
#
# Two independent version axes:
#   BASE_IMAGE       — immutable base image from the internal registry
#   IMAGE_REPOSITORY — GitLab Container Registry project path
#   APP_IMAGE_TAG    — immutable service-image tag for this release
#
# Override both when needed:
#   BASE_IMAGE=gitlab.internal:5050/group/ml-portal/base-ml:base-v1.2.0 \
#   IMAGE_REPOSITORY=gitlab.internal:5050/group/ml-portal APP_IMAGE_TAG=v1.5.0 \
#   docker compose -f docker-compose.build.yml build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # BACKEND API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile.prod
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ml-portal-base-ml:latest}
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/api:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # CELERY WORKER (same code as api, separate image)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile.prod
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ml-portal-base-ml:latest}
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/worker:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # EMBEDDING SERVICE
  # ---------------------------------------------------------------------------
  emb:
    build:
      context: .
      dockerfile: infra/docker/emb/Dockerfile.prod
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ml-portal-base-ml:latest}
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/emb:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # RERANKER SERVICE
  # ---------------------------------------------------------------------------
  rerank:
    build:
      context: .
      dockerfile: infra/docker/rerank/Dockerfile.prod
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ml-portal-base-ml:latest}
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/rerank:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # FRONTEND (multi-stage: node build → serve)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-ML Portal}
        NODE_ENV: production
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # MCP — NetBox
  # ---------------------------------------------------------------------------
  netbox-mcp-custom:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        MCP_SERVER_DIR: netbox
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/mcp-netbox:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # MCP — SQL / dbhub
  # ---------------------------------------------------------------------------
  dbhub-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        MCP_SERVER_DIR: sql
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/mcp-sql:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # MCP — Atlassian Jira Server / Data Center
  # ---------------------------------------------------------------------------
  atlassian-jira-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        MCP_SERVER_DIR: atlassian
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/mcp-atlassian-jira:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # MCP — ML inference facade
  # ---------------------------------------------------------------------------
  ml-inference-mcp:
    build:
      context: .
      dockerfile: mcp/mcp_server.dockerfile
      args:
        MCP_SERVER_DIR: ml_inference
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/mcp-ml-inference:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}

  # ---------------------------------------------------------------------------
  # NGINX (optional — bakes in static config if desired)
  # In prod we mount configs as volumes instead, so this is optional.
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: infra/nginx
      dockerfile: ../docker/nginx/Dockerfile.prod
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/nginx:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
