# Copy to .gitlab-ci.yml in the production GitLab repository.
# The protected shell runner has no Docker group membership. It may invoke only
# the root-owned /usr/local/sbin/ml-portal-deploy controller through sudo.

stages:
  - validate
  - deploy

validate-production-release:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - release.env
        - docker-compose.prod.yml
        - scripts/release/common.sh
        - scripts/release/deploy.sh
        - scripts/release/production-controller.sh
  script:
    - bash -n scripts/release/common.sh scripts/release/deploy.sh scripts/release/production-controller.sh
    - bash -c 'source scripts/release/common.sh; load_release_file'

deploy-production:
  stage: deploy
  tags:
    - production
  resource_group: production
  environment:
    name: production
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - release.env
  when: manual
  allow_failure: false
  manual_confirmation: "Deploy this immutable release to production?"
  before_script:
    - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
    - test -f release.env
    - test -f docker-compose.prod.yml
    - test -x /usr/local/sbin/ml-portal-deploy
  script:
    # Do not add git pull here. A retry must deploy this exact commit state.
    - sudo --non-interactive /usr/local/sbin/ml-portal-deploy deploy --source "$CI_PROJECT_DIR" --release "$CI_COMMIT_SHA"
  after_script:
    - sudo --non-interactive /usr/local/sbin/ml-portal-deploy status > deployment-status.env || true
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - deployment-status.env

rollback-production:
  stage: deploy
  tags:
    - production
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - release.env
  when: manual
  allow_failure: false
  manual_confirmation: "Restore the previous application release? Database migrations are not rolled back."
  script:
    - sudo --non-interactive /usr/local/sbin/ml-portal-deploy rollback
  after_script:
    - sudo --non-interactive /usr/local/sbin/ml-portal-deploy status > deployment-status.env || true
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - deployment-status.env
